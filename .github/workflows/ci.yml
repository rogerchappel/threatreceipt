name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - name: Capture fixture evidence and assert honest exit codes
        shell: bash
        run: |
          mkdir -p reports
          set +e
          node bin/threatreceipt.js run examples/shortlist.json --fixture vulnerable --execute --format json > reports/vulnerable.json
          vulnerable_code=$?
          node bin/threatreceipt.js run examples/shortlist.json --fixture secure --execute --format json > reports/secure.json
          secure_code=$?
          node bin/threatreceipt.js run examples/shortlist.json --execute --format junit > reports/secure.xml
          junit_code=$?
          set -e
          test "$vulnerable_code" -eq 1
          test "$secure_code" -eq 2
          test "$junit_code" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-evidence-node-${{ matrix.node }}
          path: reports/
          retention-days: 7
